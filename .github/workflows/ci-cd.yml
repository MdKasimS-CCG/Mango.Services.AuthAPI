name: AuthAPI CI

on:
  push:
    branches:
      - main
      - feature/hanna
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Mango.Services.AuthAPI.csproj

      - name: Build
        run: dotnet build Mango.Services.AuthAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
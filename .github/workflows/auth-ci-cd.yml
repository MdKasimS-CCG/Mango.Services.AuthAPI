name: AuthAPI CI

on:
  push:
    branches:
      - main
      - feature/hanna
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Authenticate normal .NET restore to GitHub Packages
      - name: Add GitHub Packages source
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "$GH_PACKAGES_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/MdKasimS-CCG/index.json"

      - name: Restore dependencies
        run: dotnet restore Mango.Services.AuthAPI.csproj

      - name: Build
        run: dotnet build Mango.Services.AuthAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Create temporary NuGet config for Docker
      - name: Create NuGet config
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          cat > ./NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github" value="https://nuget.pkg.github.com/MdKasimS-CCG/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="${{ github.actor }}" />
                <add key="ClearTextPassword" value="$GH_PACKAGES_TOKEN" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF

      # Set up Docker Buildx for layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Build Docker image using NuGet config as a BuildKit secret
      - name: Build Docker image
        run: |
          docker buildx build \
            --secret id=nuget_config,src=./NuGet.Config \
            --tag mango-authapi:latest \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR uses the lowercase organization name for container image paths.
          docker tag mango-authapi:latest ghcr.io/mdkasims-ccg/mango-authapi:latest
          docker push ghcr.io/mdkasims-ccg/mango-authapi:latest

      # Remove temporary credentials file
      - name: Remove NuGet config
        if: always()
        run: rm -f ./NuGet.Config